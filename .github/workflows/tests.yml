name: Verify Termylo
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: termylo-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest pytest-cov
      - name: Compile Python source
        run: python -m compileall -q termylo
      - name: Unit tests + real MCP stdio handshake + Windows PowerShell integration
        run: python -m pytest -v --cov=termylo --cov-report=term-missing
      - name: Two-way mock approval simulation
        run: python scripts/simulate.py
      - name: Termylo doctor (read-only)
        run: python -m termylo.doctor
      - name: Check Windows setup script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @('scripts/setup.ps1', 'scripts/test-local.ps1', 'termylo/native_console.ps1', 'scripts/tunnel-key.ps1', 'scripts/start-tunnel-secure.ps1', 'scripts/test-secure-tunnel-key.ps1', 'scripts/install-uri-protocol.ps1', 'scripts/test-uri-protocol.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$path contains PowerShell parser errors: $($errors | Out-String)" }
          }
      - name: Secure DPAPI key and launcher smoke (fake key only)
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          & .\scripts\test-secure-tunnel-key.ps1

      - name: Test local error-review consent and auto-on privacy
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          & .\scripts\native_review_smoke.ps1

      - name: Run full Windows installation setup
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          & .\scripts\setup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Termylo setup returned a failing exit code.' }
      - name: Test per-user URI registration (no tunnel launch)
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          & .\scripts\test-uri-protocol.ps1

      - name: Verify one-command Windows testing (headless)
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          & .\scripts\test-local.ps1 -SkipGui
          if ($LASTEXITCODE -ne 0) { throw 'One-command local test failed.' }
      - name: Compile local scripts
        run: python -m compileall -q scripts
      - name: Packaging metadata
        run: python -m pip show termylo
