name: Verify Termylo
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest pytest-cov
      - name: Compile Python source
        run: python -m compileall -q termylo
      - name: Unit tests + real MCP stdio handshake + Windows PowerShell integration
        run: python -m pytest -v --cov=termylo --cov-report=term-missing
      - name: Two-way mock approval simulation
        run: python scripts/simulate.py
      - name: Termylo doctor (read-only)
        run: python -m termylo.doctor
      - name: Check Windows setup script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @('scripts/setup.ps1', 'scripts/test-local.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$path contains PowerShell parser errors: $($errors | Out-String)" }
          }
      - name: Run full Windows installation setup
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          & .\scripts\setup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Termylo setup returned a failing exit code.' }
      - name: Verify one-command Windows testing (headless)
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: powershell
        run: |
          & .\scripts\test-local.ps1 -SkipGui
          if ($LASTEXITCODE -ne 0) { throw 'One-command local test failed.' }
      - name: Compile local scripts
        run: python -m compileall -q scripts
      - name: Packaging metadata
        run: python -m pip show termylo

  cleanup_merged_branches:
    name: Remove merged branches, keep main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete only the two previously merged development branches
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const completed = [
              {number: 1, branch: 'feat/personal-powershell-mcp'},
              {number: 2, branch: 'audit/v02-line-by-line'},
            ];
            for (const {number, branch} of completed) {
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
              if (!pr.merged_at || pr.head.ref !== branch) {
                throw new Error('Refusing to delete an unmerged or mismatched branch: ' + branch);
              }
              try {
                await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + branch});
                core.info('Deleted merged branch ' + branch);
              } catch (error) {
                if (error.status === 404 || error.status === 422 && /does not exist/i.test(error.message)) {
                  core.info('Already absent: ' + branch);
                } else {
                  throw error;
                }
              }
            }
