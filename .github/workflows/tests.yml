name: Tests
on:
  push:
    branches: [main, feat/personal-powershell-mcp]
  pull_request:
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Termylo
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Import MCP server
        run: python -c "from termylo.server import mcp; print('MCP import passed')"
